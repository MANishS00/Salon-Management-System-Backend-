<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Salon Details</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Modern Premium Font -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background: radial-gradient(circle at 10% 20%, rgb(18, 18, 22) 0%, rgb(28, 28, 38) 90%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #f3f4f6;
            overflow-x: hidden;
            position: relative;
        }

        /* Abstract glowing backdrop shapes */
        .glow-sphere {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            z-index: 1;
            opacity: 0.3;
        }
        .sphere-1 {
            width: 300px;
            height: 300px;
            background: linear-gradient(135deg, #d4af37, #f3e5ab);
            top: -50px;
            left: -50px;
        }
        .sphere-2 {
            width: 400px;
            height: 400px;
            background: linear-gradient(135deg, #8a2be2, #4169e1);
            bottom: -100px;
            right: -50px;
        }

        .card {
            width: 90%;
            max-width: 460px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            padding: 40px 30px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            z-index: 10;
            text-align: center;
            transform: translateY(0);
            transition: transform 0.4s cubic-bezier(0.165, 0.84, 0.44, 1), box-shadow 0.4s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5), 0 0 30px rgba(212, 175, 55, 0.1);
        }

        /* Luxury Logo placeholder icon */
        .salon-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #d4af37, #f3e5ab);
            border-radius: 50%;
            margin: 0 auto 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 25px rgba(212, 175, 55, 0.3);
            animation: float 4s ease-in-out infinite;
        }
        
        .salon-icon svg {
            width: 38px;
            height: 38px;
            fill: #121216;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 30px;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ffffff 30%, #a1a1aa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .details-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 35px;
            text-align: left;
        }

        .item {
            display: flex;
            align-items: flex-start;
            gap: 15px;
            background: rgba(255, 255, 255, 0.02);
            padding: 16px 20px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: background 0.3s ease;
        }

        .item:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .item-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            background: rgba(212, 175, 55, 0.1);
            border-radius: 10px;
            color: #d4af37;
            flex-shrink: 0;
        }

        .item-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #8b8d99;
            font-weight: 600;
        }

        .value {
            font-size: 1rem;
            color: #e4e4e7;
            font-weight: 400;
            word-break: break-word;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.165, 0.84, 0.44, 1);
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        .btn-primary {
            background: linear-gradient(135deg, #d4af37, #c5a880);
            color: #121216;
            box-shadow: 0 8px 20px rgba(212, 175, 55, 0.2);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(212, 175, 55, 0.35);
            background: linear-gradient(135deg, #f3e5ab, #d4af37);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: #e4e4e7;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
        }

        /* Loading skeleton styles */
        .skeleton {
            background: linear-gradient(90deg, rgba(255, 255, 255, 0.03) 25%, rgba(255, 255, 255, 0.08) 50%, rgba(255, 255, 255, 0.03) 75%);
            background-size: 200% 100%;
            animation: shimming 1.5s infinite;
            border-radius: 8px;
        }
        .skeleton-title {
            height: 35px;
            width: 60%;
            margin: 0 auto 30px;
        }
        .skeleton-text {
            height: 20px;
            width: 80%;
        }

        @keyframes shimming {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
    </style>
</head>
<body>

    <div class="glow-sphere sphere-1"></div>
    <div class="glow-sphere sphere-2"></div>

    <div class="card">
        <!-- Salon Icon -->
        <div class="salon-icon">
            <svg viewBox="0 0 24 24">
                <path d="M19.5 9.5c0-1.93-1.57-3.5-3.5-3.5-.67 0-1.3.19-1.83.52C13.41 5.43 12 3 12 3S10.59 5.43 9.83 6.52c-.53-.33-1.16-.52-1.83-.52-1.93 0-3.5 1.57-3.5 3.5 0 2.21 2.3 5.41 6.57 9.17l.93.81.93-.81c4.27-3.76 6.57-6.96 6.57-9.17zM12 16.5c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/>
                <circle cx="12" cy="11.5" r="2"/>
            </svg>
        </div>

        <h1 id="salonName" class="skeleton skeleton-title"></h1>

        <div class="details-container">
            <!-- Phone -->
            <div class="item">
                <div class="item-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
                    </svg>
                </div>
                <div class="item-info">
                    <span class="label">Phone</span>
                    <span id="phone" class="value skeleton skeleton-text"></span>
                </div>
            </div>

            <!-- Email -->
            <div class="item">
                <div class="item-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                        <polyline points="22,6 12,13 2,6"/>
                    </svg>
                </div>
                <div class="item-info">
                    <span class="label">Email</span>
                    <span id="email" class="value skeleton skeleton-text"></span>
                </div>
            </div>

            <!-- Address -->
            <div class="item">
                <div class="item-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
                        <circle cx="12" cy="10" r="3"/>
                    </svg>
                </div>
                <div class="item-info">
                    <span class="label">Address</span>
                    <span id="address" class="value skeleton skeleton-text"></span>
                </div>
            </div>
        </div>

        <div class="btn-group">
            <a id="registerLink" href="#" class="btn btn-primary">Join Customer List</a>
            <button class="btn btn-secondary" onclick="alert('Online bookings coming soon!')">Booking Coming Soon</button>
        </div>
    </div>

    <script>
        const slug = window.location.pathname.split("/").pop() || window.location.pathname.split("/")[window.location.pathname.split("/").length - 2];

        // Setup the registration button href link dynamically
        document.getElementById("registerLink").href = `/api/qr/salon/${slug}/register`;

        fetch(`/api/qr/public-salon/${slug}`)
            .then(res => {
                if (!res.ok) throw new Error('Salon not found');
                return res.json();
            })
            .then(data => {
                // Remove skeleton class and insert actual values
                const elements = ["salonName", "phone", "email", "address"];
                elements.forEach(id => {
                    const el = document.getElementById(id);
                    el.classList.remove("skeleton", "skeleton-title", "skeleton-text");
                });

                document.getElementById("salonName").innerText = data.salon_name || "-";
                document.getElementById("phone").innerText = data.phone || "-";
                document.getElementById("email").innerText = data.email || "-";
                document.getElementById("address").innerText = data.address || "-";
            })
            .catch(err => {
                document.querySelector(".card").innerHTML = `
                    <div style="padding: 20px; color: #ef4444;">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-bottom: 15px;">
                            <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
                        </svg>
                        <h2 style="font-weight: 600; margin-bottom: 8px;">Failed to Load Salon</h2>
                        <p style="font-size: 0.9rem; opacity: 0.8;">The salon details could not be retrieved. Please check your link.</p>
                    </div>
                `;
            });
    </script>
</body>
</html>
